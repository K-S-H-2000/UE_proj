services:
  db:
    image: postgres:16
    container_name: ue-postgres
    environment:
      POSTGRES_DB: ue
      POSTGRES_USER: ue_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - ue-db-data:/var/lib/postgresql/data
      # 최초 실행 시 이 폴더의 .sql 파일이 자동 실행됨
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ue_admin -d ue"]
      interval: 10s
      timeout: 5s
      retries: 5
 
volumes:
  ue-db-data: